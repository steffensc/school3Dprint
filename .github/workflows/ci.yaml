name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolprint
          POSTGRES_PASSWORD: schoolprint
          POSTGRES_DB: schoolprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolprint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCHOOLPRINT_DATABASE_URL: postgresql+psycopg://schoolprint:schoolprint@localhost:5432/schoolprint_test
      SCHOOLPRINT_SECRET_KEY: ci-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check app tests
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
